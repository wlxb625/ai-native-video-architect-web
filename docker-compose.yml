services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cineweave
      POSTGRES_USER: cineweave
      POSTGRES_PASSWORD: cineweave
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineweave -d cineweave"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5432:5432"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgres://cineweave:cineweave@postgres:5432/cineweave
      API_PORT: 8780
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8780:8780"]
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgres://cineweave:cineweave@postgres:5432/cineweave
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment:
      VITE_API_BASE_URL: http://localhost:8780/v1
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  postgres_data:
