name: Validate Independent Rebuild

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-independent-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent rebuild
        uses: actions/checkout@v4
        with:
          ref: independent-rebuild

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
