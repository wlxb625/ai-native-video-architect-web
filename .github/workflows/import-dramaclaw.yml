name: Import DramaClaw Upstream

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    if: github.repository == 'wlxb625/ai-native-video-architect-web'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import DramaClaw source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 https://github.com/dramaclaw/dramaclaw.git /tmp/dramaclaw
          UPSTREAM_SHA="$(git -C /tmp/dramaclaw rev-parse HEAD)"

          git fetch origin main
          git checkout -B main origin/main

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            /tmp/dramaclaw/ ./

          cat > UPSTREAM.md <<EOF
          # Upstream source

          This repository was initialized from [dramaclaw/dramaclaw](https://github.com/dramaclaw/dramaclaw).

          - Upstream commit: \`${UPSTREAM_SHA}\`
          - Imported as a source snapshot for adaptation and evaluation.
          - Upstream code remains subject to the Elastic License 2.0 and any file-level notices included in the repository.
          - This repository is a modified copy and is not affiliated with or endorsed by the DramaClaw authors.
          EOF

          git add -A
          git commit -m "Import DramaClaw upstream source snapshot (${UPSTREAM_SHA})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main
